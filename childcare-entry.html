<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>SafeChild DX</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light only;
  --bg:#F7F0E6; --cream:#FFFBF5; --sub:#5A4E44;
  --paper:#F3E6D4; --ink:#2C241C; --isub:#6A5E54; --line:#E4D5C4;
  --green:#3B7A58;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
body{
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  font-size:15px;line-height:1.7;
  word-break:auto-phrase;line-break:strict;text-wrap:balance;
}
img{display:block;max-width:100%}
.mincho{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;font-weight:700}

/* 上 */
.hero{padding:26px 16px 0}
.in{max-width:1040px;margin:0 auto}
.lock{display:flex;align-items:baseline;gap:10px}
.lock .nm{font-size:20px;letter-spacing:.02em;color:var(--ink)}
.lock .sb{font-size:11px;color:var(--sub);letter-spacing:.08em}
h1{margin:22px 0 0;font-size:29px;line-height:1.45;font-weight:700;letter-spacing:.01em;color:var(--ink)}
.lead{margin:12px 0 0;font-size:14.5px;color:var(--sub);max-width:30em}
.mode{display:none}

/* 実画面 */
.stack{position:relative;max-width:1040px;margin:26px auto 0;padding:0 16px}
.plate{position:relative;padding-top:60%}
.sh{position:absolute;border:1px solid var(--line);box-shadow:0 12px 32px rgba(28,26,22,.12);background:#fff;border-radius:10px;overflow:hidden}
.sh img{width:100%;height:auto}
.sh.a{left:0;top:8%;width:62%;z-index:1;transform:rotate(-1.4deg)}
.sh.b{left:22%;top:0;width:66%;z-index:3}
.sh.c{right:0;top:16%;width:56%;z-index:2;transform:rotate(1.6deg)}
.shcap{position:absolute;left:0;bottom:-22px;font-size:10.5px;color:var(--sub);letter-spacing:.06em}
.cta{max-width:1040px;margin:46px auto 0;padding:0 16px}
.cta a{display:flex;align-items:center;justify-content:center;height:54px;background:var(--green);
  color:#fff;text-decoration:none;border-radius:12px;font-size:16px;letter-spacing:.02em;font-weight:500}
.hint{text-align:center;font-size:11.5px;color:var(--sub);margin-top:10px}

/* 下 */
.low{background:var(--paper);color:var(--ink);margin-top:46px;padding:34px 16px 40px}
.lowttl{max-width:1040px;margin:0 auto 14px;font-size:12px;color:var(--isub);letter-spacing:.08em}
.cards{max-width:1040px;margin:0 auto;display:grid;gap:12px;grid-template-columns:1fr}
.card{background:#fff;border:1px solid var(--line);text-decoration:none;color:inherit;display:block;overflow:hidden}
.thumb{height:132px;overflow:hidden;border-bottom:1px solid var(--line);background:#fff}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top center}
.ct{padding:13px 14px 15px}
.c1{font-size:15.5px}
.c2{font-size:12.5px;color:var(--isub);margin-top:5px}
.foot{max-width:1040px;margin:26px auto 0;font-size:11px;color:var(--isub);
  display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px}

@media (min-width:720px){
  .hero{padding-top:40px}
  h1{font-size:40px;margin-top:26px}
  .lead{font-size:16px}
  .cards{grid-template-columns:1fr 1fr 1fr}
  .cta a{max-width:320px}
}
@media (max-width:719px){
  .plate{padding-top:78%}
  .sh.a{width:74%;top:12%}
  .sh.b{width:82%;left:12%}
  .sh.c{width:70%;top:26%}
}
</style>
</head>
<body>

<div class="hero"><div class="in">
  <div class="lock"><span class="nm mincho">SafeChild DX</span><span class="sb">保育の記録と報告</span></div>
  <h1 class="mincho">園の出来事を、<br>園の決まりに沿った報告書にする</h1>
  <p class="lead">起きたことをその場で声で残すと、園の決まりに沿った報告書の下書きになります。保護者への連絡文まで一度に揃います。</p>
  <span class="mode"></span>
</div></div>

<div class="stack"><div class="plate">
  <div class="sh a"><img src="images/hero-reports.jpg" alt="報告書一覧"></div>
  <div class="sh c"><img src="images/hero-chat.jpg" alt="質問・相談"></div>
  <div class="sh b"><img src="images/hero-today.jpg" alt="今日の様子"></div>
</div></div>

<div class="cta">
  <a href="dashboard.html">今日の様子を開く</a>
</div>

<div class="low">
  <div class="lowttl">よく使う画面</div>
  <div class="cards">
    <a class="card" href="dashboard.html#voice">
      <div class="thumb"><img src="images/hero-voice.jpg" alt=""></div>
      <div class="ct"><div class="c1">話して、報告書にする</div>
      <div class="c2">話した内容から、報告書の下書きまで</div></div>
    </a>
    <a class="card" href="dashboard.html#reports">
      <div class="thumb"><img src="images/hero-reports.jpg" alt=""></div>
      <div class="ct"><div class="c1">できた報告書を見る</div>
      <div class="c2">どの決まりを見たかを、報告書に付けています</div></div>
    </a>
    <a class="card" href="dashboard.html#chat">
      <div class="thumb"><img src="images/hero-chat.jpg" alt=""></div>
      <div class="ct"><div class="c1">この対応でよいか確かめる</div>
      <div class="c2">園の決まりに沿って答えます</div></div>
    </a>
  </div>
  <div class="foot"><span>ひまわり保育園</span><span>保育の記録と報告</span></div>
</div>

</body>
</html>
